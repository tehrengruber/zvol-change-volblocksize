name: build-and-release

on:
  push:
    branches: [main]      # feature branches are covered via their PR
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed for the release job to attach assets on tag builds

jobs:
  test:
    # Build and run the suite natively on both architectures.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install ZFS and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zfsutils-linux
          # Load the zfs module (pull the matching modules package if needed).
          sudo modprobe zfs \
            || { sudo apt-get install -y "linux-modules-extra-$(uname -r)"; sudo modprobe zfs; }
          zfs version
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test (needs root for real pools on loop files)
        run: sudo ctest --test-dir build --output-on-failure

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # Build and package inside real Debian trixie so the binary links against
      # trixie's libc/libstdc++ and the .deb's dependencies are computed for it.
      - name: Compile and package (.deb) on Debian trixie
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake dpkg-dev file
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ( cd build && cpack -G DEB )
          '
      - name: Show package info
        run: dpkg-deb --info build/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: deb
          path: build/*.deb

  static-binary:
    # musl + -static => a single, fully static binary that runs on any Linux of that
    # architecture with no installation and no shared-library dependencies.  Built
    # natively on each arch's runner (the Alpine image is pulled for that arch).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build static musl binary (Alpine)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -euxc '
            apk add --no-cache build-base cmake linux-headers
            cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
              -DZCVB_STATIC=ON -DBUILD_TESTING=OFF
            cmake --build build-static -j"$(nproc)"
            strip build-static/zvol-change-volblocksize
          '
          cp build-static/zvol-change-volblocksize \
             zvol-change-volblocksize-static-linux-${{ matrix.arch }}
      - name: Verify it is static
        run: file zvol-change-volblocksize-static-linux-${{ matrix.arch }} | grep -q 'statically linked'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: static-${{ matrix.arch }}
          path: zvol-change-volblocksize-static-linux-${{ matrix.arch }}

  # Single release job (only on tags) so there is no race between builds trying
  # to create the same release. It runs after the builds+tests pass, gathers
  # their artifacts, and publishes one release with everything attached.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, deb, static-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
