name: build-and-release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed for the release job to attach assets on tag builds

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ZFS and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zfsutils-linux
          # Load the zfs module (pull the matching modules package if needed).
          sudo modprobe zfs \
            || { sudo apt-get install -y "linux-modules-extra-$(uname -r)"; sudo modprobe zfs; }
          zfs version
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Test (needs root for real pools on loop files)
        run: sudo ctest --test-dir build --output-on-failure

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build and package inside real Debian trixie so the binary links against
      # trixie's libc/libstdc++ and the .deb's dependencies are computed for it.
      - name: Compile and package (.deb) on Debian trixie
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:trixie bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential cmake dpkg-dev file
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ( cd build && cpack -G DEB )
          '
      - name: Show package info
        run: dpkg-deb --info build/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

  static-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # musl + -static => a single, fully static binary that runs on any Linux
      # x86-64 with no installation and no shared-library dependencies.
      - name: Build static musl binary (Alpine)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -euxc '
            apk add --no-cache build-base cmake linux-headers
            cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release \
              -DZCVB_STATIC=ON -DBUILD_TESTING=OFF
            cmake --build build-static -j"$(nproc)"
            strip build-static/zvol-change-volblocksize
          '
          cp build-static/zvol-change-volblocksize \
             zvol-change-volblocksize-static-linux-x86_64
      - name: Verify it is static
        run: file zvol-change-volblocksize-static-linux-x86_64 | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: zvol-change-volblocksize-static-linux-x86_64

  # Single release job (only on tags) so there is no race between builds trying
  # to create the same release. It runs after the builds+tests pass, gathers
  # their artifacts, and publishes one release with everything attached.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, deb, static-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
